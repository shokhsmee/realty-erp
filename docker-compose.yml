services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realty
      POSTGRES_PASSWORD: realty
      POSTGRES_DB: realty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # override host inside the compose network
      DATABASE_URL: postgresql+asyncpg://realty:realty@db:5432/realty
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app          # live-reload during development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
